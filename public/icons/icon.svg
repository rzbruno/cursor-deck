<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#131929"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accent-grad)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing Hexagon / Terminal Symbol -->
  <g filter="url(#glow)">
    <path d="M 160 160 L 256 256 L 160 352" fill="none" stroke="url(#accent-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="280" y1="352" x2="352" y2="352" stroke="#06b6d4" stroke-width="36" stroke-linecap="round"/>
  </g>
</svg>
